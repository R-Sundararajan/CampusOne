name: CampusOne CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: campusone
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: campusone_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U campusone -d campusone_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://campusone:ci-only-password@127.0.0.1:5432/campusone_test
      TEST_DATABASE_URL: postgresql://campusone:ci-only-password@127.0.0.1:5432/campusone_test
      DEMO_PASSWORD: CI-demo-only-password-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:verify-upgrade
      - run: npm run db:seed
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:release
      - run: npm run build
      - run: docker build -t campusone:ci .
      - name: Production Docker migrations, restart and failure guards
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U campusone campusone_startup_test
          export DATABASE_URL=postgresql://campusone:ci-only-password@127.0.0.1:5432/campusone_startup_test
          export DIRECT_URL="$DATABASE_URL"
          docker run -d --name campusone-ci --network host \
            -e NODE_ENV=production -e HOST=0.0.0.0 -e PORT=3000 \
            -e APP_ORIGIN=https://campusone-ci.example -e DATABASE_URL -e DIRECT_URL \
            -e JWT_SECRET=ci-only-synthetic-secret-at-least-32-characters \
            -e INSTITUTIONAL_AUTH_MODE=domain-only-demo -e STORAGE_MODE=database campusone:ci
          node .github/scripts/verify-http.mjs http://127.0.0.1:3000
          test "$(docker exec "${{ job.services.postgres.id }}" psql -U campusone -d campusone_startup_test -Atc 'SELECT count(*) FROM "_prisma_migrations" WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL')" = 7
          test "$(docker exec "${{ job.services.postgres.id }}" psql -U campusone -d campusone_startup_test -Atc 'SELECT count(*) FROM "User"')" = 0
          docker restart campusone-ci
          node .github/scripts/verify-http.mjs http://127.0.0.1:3000
          docker logs campusone-ci | grep 'No pending migrations to apply'
          test "$(docker exec campusone-ci id -u)" = 1000
          docker run -d --name campusone-migration-failure --network host \
            -e NODE_ENV=production -e APP_ORIGIN=https://campusone-ci.example \
            -e DATABASE_URL -e DIRECT_URL=postgresql://invalid:invalid@127.0.0.1:5432/campusone_startup_test \
            -e JWT_SECRET=ci-only-synthetic-secret-at-least-32-characters \
            -e INSTITUTIONAL_AUTH_MODE=domain-only-demo -e STORAGE_MODE=database campusone:ci
          failure_code=$(timeout 60 docker wait campusone-migration-failure)
          test "$failure_code" -ne 0
          if docker logs campusone-migration-failure 2>&1 | grep -q 'CampusOne listening'; then exit 1; fi
      - name: Docker diagnostics
        if: failure()
        run: |
          docker logs campusone-ci || true
          docker logs campusone-migration-failure || true
      - name: Clean up local CI container
        if: always()
        run: docker rm -f campusone-ci campusone-migration-failure || true
