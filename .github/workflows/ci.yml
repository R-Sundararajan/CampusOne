name: CampusOne CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: campusone
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: campusone_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U campusone -d campusone_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://campusone:ci-only-password@127.0.0.1:5432/campusone_test
      TEST_DATABASE_URL: postgresql://campusone:ci-only-password@127.0.0.1:5432/campusone_test
      DEMO_PASSWORD: CI-demo-only-password-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:verify-upgrade
      - run: npm run db:seed
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:release
      - run: npm run build
      - run: docker build -t campusone:ci .
      - name: Production Docker startup without SMTP
        run: |
          docker run -d --name campusone-ci --network host \
            -e NODE_ENV=production -e HOST=0.0.0.0 -e PORT=3000 \
            -e APP_ORIGIN=https://campusone-ci.example -e DATABASE_URL \
            -e JWT_SECRET=ci-only-synthetic-secret-at-least-32-characters \
            -e INSTITUTIONAL_AUTH_MODE=domain-only-demo -e STORAGE_MODE=database campusone:ci
          node .github/scripts/verify-http.mjs http://127.0.0.1:3000
      - name: Docker diagnostics
        if: failure()
        run: docker logs campusone-ci || true
      - name: Clean up local CI container
        if: always()
        run: docker rm -f campusone-ci || true

  deploy:
    needs: checks
    # Set the repository variable only after the owner authorizes deployment.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_RAILWAY_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    concurrency:
      group: campusone-production
      cancel-in-progress: false
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_PUBLIC_URL: ${{ vars.RAILWAY_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify deployment configuration
        shell: bash
        run: |
          test -n "$RAILWAY_TOKEN"
          test -n "$RAILWAY_PROJECT_ID"
          test -n "$RAILWAY_SERVICE_ID"
          test -n "$RAILWAY_ENVIRONMENT_ID"
          test -n "$RAILWAY_PUBLIC_URL"
      - run: npm install --global @railway/cli@5.64.2
      - name: Deploy checked commit and wait for deployment outcome
        run: node .github/scripts/deploy-railway.mjs
      - name: Verify readiness and frontend
        shell: bash
        run: |
          node .github/scripts/verify-http.mjs "$RAILWAY_PUBLIC_URL"
