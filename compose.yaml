name: campusone
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campusone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-campusone}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-campusone}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-campusone}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
      STORAGE_MODE: database
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
